name: Site watchdog
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      test_text:
        description: 'Send a test text even if every site is up'
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: watchdog
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check every page (3 tries each, must answer AND show its text)
        id: check
        run: |
          fail=""
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue;; esac
            url=$(echo "${line%%|*}" | xargs); want=$(echo "${line#*|}" | xargs)
            [ "$url" = "$want" ] && want=""
            ok=0; why=""
            for try in 1 2 3; do
              code=$(curl -sL -o /tmp/page.html -m 20 -w '%{http_code}' "$url" || true)
              if [ "$code" != "200" ]; then why="code $code"
              elif [ -n "$want" ] && ! python3 -c "import re,html,sys;t=open('/tmp/page.html',errors='ignore').read();t=html.unescape(re.sub(r'<[^>]+>',' ',t));sys.exit(0 if sys.argv[1].lower() in re.sub(r'\\s+',' ',t).lower() else 1)" "$want"; then why="answered but \"$want\" is missing"
              else ok=1; break; fi
              sleep 20
            done
            if [ "$ok" = 1 ]; then echo "$url -> OK"; else echo "$url -> PROBLEM: $why"; fi
            [ "$ok" = 1 ] || fail="$fail
          - $url ($why)"
          done < sites.txt
          { echo "fail<<EOF"; echo "$fail"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: Last run's result
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list -R "$GITHUB_REPOSITORY" --workflow watchdog.yml --status completed -L 1 --json conclusion -q '.[0].conclusion' || true)
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
      - name: Text once when it breaks, once when it is back
        env:
          SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          KEY: ${{ secrets.TWILIO_API_KEY_SID }}
          TOKEN: ${{ secrets.TWILIO_API_KEY_SECRET }}
          TEST: ${{ inputs.test_text }}
          FROM: ${{ secrets.ALERT_FROM }}
          TO: ${{ secrets.ALERT_TO }}
          FAIL: ${{ steps.check.outputs.fail }}
          PREV: ${{ steps.prev.outputs.prev }}
        run: |
          if [ -z "$SID" ] || [ -z "$KEY" ] || [ -z "$TOKEN" ] || [ -z "$FROM" ] || [ -z "$TO" ]; then echo "Twilio secrets not set: email only."; exit 0; fi
          msg=""
          FAIL=$(echo "$FAIL" | sed "/^ *$/d")
          if [ -n "$FAIL" ] && [ "$PREV" != "failure" ]; then msg="Site Problem

          $FAIL

          Checked 3 times from GitHub. You get one more text when it is back."; fi
          if [ -z "$FAIL" ] && [ "$PREV" = "failure" ]; then msg="Site Back Up

          Every site is answering again."; fi
          if [ "$TEST" = "true" ] && [ -z "$msg" ]; then msg="Site watchdog test: texts are working. You will get one text if a site goes down and one when it is back."; fi
          if [ -n "$msg" ]; then
            curl -s -o /tmp/tw.json -w 'twilio %{http_code}\n' -X POST "https://api.twilio.com/2010-04-01/Accounts/$SID/Messages.json" -u "$KEY:$TOKEN" --data-urlencode "To=$TO" --data-urlencode "From=$FROM" --data-urlencode "Body=$msg"
            python3 -c "import json;d=json.load(open('/tmp/tw.json'));print('twilio says:',d.get('code'),d.get('message'),'| status:',d.get('status'))" || true
            echo "key starts with: ${KEY:0:2}  key length: ${#KEY}  secret length: ${#TOKEN}"
          fi
      - name: Fail the run if a site is down
        env:
          FAIL: ${{ steps.check.outputs.fail }}
        run: |
          if [ -n "$(echo "$FAIL" | sed '/^ *$/d')" ]; then echo "PROBLEM:$FAIL"; exit 1; fi
          echo "All sites up."
